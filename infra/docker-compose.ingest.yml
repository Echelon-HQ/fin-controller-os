services:
  controller:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: fin-controller-ingest
    volumes:
      - ../data:/app/data
      - ../config:/app/config
      - ../log:/app/log
    env_file:
      - ../.env
    command: python -m controller.daily_run
    depends_on:
      - ollama
